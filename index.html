<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>มาง้ออะ 🥺💕</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(140deg,#fff1f6,#ffd6e7);font-family:system-ui,sans-serif;color:#a63e66;display:grid;place-items:center;text-align:center;overflow:hidden}.wrap{width:min(95vw,460px);padding:24px}h1{font-size:clamp(29px,7vw,40px)}p{font-size:17px}.stage{height:300px;position:relative;margin:15px auto}button{border:0;border-radius:30px;padding:15px 23px;font-size:18px;font-weight:700;cursor:pointer;touch-action:manipulation}#yes{position:absolute;top:25px;left:7%;background:#f74e8d;color:white;transform-origin:top left;transition:transform .2s;z-index:2}#no{position:absolute;top:25px;right:7%;background:white;color:#c84c7a;z-index:3;transition:left .12s,top .12s}#success{display:none}#success img{width:min(80vw,320px);aspect-ratio:1;object-fit:cover;border-radius:25px;box-shadow:0 12px 35px #d6598b55}</style></head><body><main class="wrap"><section id="question"><div style="font-size:65px">🐶</div><h1>มาง้ออะ 🥺💕</h1><p>เค้าขอโทษน้าา หายงอนกันได้มั้ย</p><div class="stage" id="stage"><button id="yes">💖 หายงอน</button><button id="no">😤 โกด</button></div><p id="message">เลือกดี ๆ น้าา 🥹</p></section><section id="success"><h1>เย้! คืนดีกันแล้วนะ 💗</h1><p>รักที่สุดเลยยย 🥹💕</p><img src="puppies.jpg" alt="ลูกหมาสีดำกอดลูกหมาสีขาว"><h2>🐶💖🐶</h2><p>สัญญาว่าจะไม่ทำให้งอนอีกน้าา</p></section></main><script>let count=0,last=0;const no=document.querySelector('#no'),yes=document.querySelector('#yes'),stage=document.querySelector('#stage'),msg=document.querySelector('#message');const lines=['งื้ออ อย่าโกดเลย 🥺','จับไม่ได้หรอก แบร่ 😝','หายงอนเถอะน้าา 💕','ปุ่มนี้ไม่ให้กดหรอก 😤','รักนะ รู้ยังงง 💖'];function flee(e){if(e?.cancelable)e.preventDefault();if(Date.now()-last<150)return;last=Date.now();count++;let scale=Math.max(.2,1-count*.12);no.style.fontSize=18*scale+'px';no.style.padding=15*scale+'px '+23*scale+'px';const maxX=stage.clientWidth-no.offsetWidth,maxY=stage.clientHeight-no.offsetHeight;no.style.left=Math.random()*Math.max(0,maxX)+'px';no.style.top=(100+Math.random()*Math.max(0,maxY-100))+'px';no.style.right='auto';yes.style.transform=`scale(${Math.min(2.25,1+count*.16)})`;msg.textContent=lines[(count-1)%lines.length]}no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')flee(e)});no.addEventListener('pointerdown',flee);no.addEventListener('click',flee);yes.addEventListener('click',()=>{document.querySelector('#question').style.display='none';document.querySelector('#success').style.display='block'});</script></body></html>
