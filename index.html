
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>มาง้ออะ 💨</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: linear-gradient(140deg, #fff1f6, #ffd6e7);
      font-family: system-ui, sans-serif;
      color: #a63e66;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
    }

    .wrap {
      width: min(95vw, 460px);
      padding: 16px;
    }

    h1 {
      font-size: clamp(29px, 7vw, 40px);
      margin: 12px 0;
    }

    p {
      font-size: 17px;
      margin: 12px 0;
    }

    .dog {
      font-size: 60px;
      line-height: 1.2;
    }

    /* ===== พื้นที่ปุ่ม ===== */
    .stage {
      height: 175px;
      position: relative;
      margin: 12px auto 0;
    }

    button {
      border: 0;
      border-radius: 30px;
      padding: 15px 23px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
    }

    /* ===== ปุ่มหายโกด ===== */
    #yes {
      position: absolute;
      top: 15px;
      left: 7%;
      background: #f74e8d;
      color: white;
      transform-origin: top left;
      transition: transform 0.2s;
      z-index: 2;
    }

    /* ===== ปุ่มโกด ===== */
    #no {
      position: absolute;
      top: 15px;
      right: 7%;
      background: white;
      color: #c84c7a;
      z-index: 3;
      transition: left 0.12s, top 0.12s;
    }

    #message {
      margin-top: 0;
      font-size: 16px;
    }

    /* ===== หน้าคืนดี ===== */
    #success {
      display: none;
    }

    #success img {
      width: min(75vw, 280px);
      max-height: 40dvh;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 25px;
      box-shadow: 0 12px 35px #d6598b55;
    }

    /* ===== ปรับสำหรับมือถือ ===== */
    @media (max-width: 480px) {
      .wrap {
        padding: 12px;
      }

      .dog {
        font-size: 55px;
      }

      .stage {
        height: 165px;
      }

      button {
        font-size: 16px;
        padding: 13px 18px;
      }
    }

    /* ===== ปรับสำหรับจอเตี้ย ===== */
    @media (max-height: 600px) {
      .dog {
        font-size: 42px;
      }

      h1 {
        margin: 6px 0;
      }

      p {
        margin: 7px 0;
      }

      .stage {
        height: 130px;
      }

      #success img {
        max-height: 32dvh;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <!-- ===== หน้าแรก ===== -->
    <section id="question">

      <div class="dog">🐶</div>

      <h1>มาง้ออะ💨</h1>

      <p>หายโกดกันได้มั้ย</p>

      <div class="stage" id="stage">

        <button id="yes">
          💖 หายโกด
        </button>

        <button id="no">
          😤 โกด
        </button>

      </div>

      <p id="message">เลือกดี ๆ น้าา 🥹</p>

    </section>


    <!-- ===== หน้าคืนดี ===== -->
    <section id="success">

      <h1>เย้! คืนดีกันแลวว</h1>

      <p>ปุ้ดดดดดดด💨</p>

      <img
        src="puppies.jpg"
        alt="ลูกหมาสีดำกอดลูกหมาสีขาว"
      >

      <h2>🐶🐶🐶</h2>

    </section>

  </main>


  <script>
    let count = 0;
    let last = 0;

    const no = document.querySelector("#no");
    const yes = document.querySelector("#yes");
    const stage = document.querySelector("#stage");
    const msg = document.querySelector("#message");

    const lines = [
      "งื้ออ อย่าโกดเลย 🥺",
      "จับไม่ได้หรอก แบร่ 😝",
      "หายโกดเถอะน้าา 💕",
      "ปุ่มนี้ไม่ให้กดหรอก 😤",
      "กดฉันให้ได้สิ 💨"
    ];

    // ===== ปุ่มโกดหนี =====
    function flee(e) {

      if (e?.cancelable) {
        e.preventDefault();
      }

      if (Date.now() - last < 150) {
        return;
      }

      last = Date.now();
      count++;

      // ปุ่มโกดเล็กลง
      let scale = Math.max(0.2, 1 - count * 0.12);

      no.style.fontSize = (18 * scale) + "px";

      no.style.padding =
        (15 * scale) + "px " +
        (23 * scale) + "px";

      // สุ่มตำแหน่งภายในพื้นที่ปุ่ม
      const maxX = stage.clientWidth - no.offsetWidth;
      const maxY = stage.clientHeight - no.offsetHeight;

      no.style.left =
        Math.random() * Math.max(0, maxX) + "px";

      no.style.top =
        (65 + Math.random() * Math.max(0, maxY - 65)) + "px";

      no.style.right = "auto";

      // ปุ่มหายโกดใหญ่ขึ้น
      yes.style.transform =
        `scale(${Math.min(2.25, 1 + count * 0.16)})`;

      // เปลี่ยนข้อความ
      msg.textContent = lines[(count - 1) % lines.length];
    }

    // เมาส์เข้าใกล้ปุ่มโกด
    no.addEventListener("pointerenter", e => {
      if (e.pointerType === "mouse") {
        flee(e);
      }
    });

    // แตะบนมือถือ
    no.addEventListener("pointerdown", flee);
    no.addEventListener("click", flee);

    // กดหายโกด
    yes.addEventListener("click", () => {
      document.querySelector("#question").style.display = "none";
      document.querySelector("#success").style.display = "block";
    });

  </script>

</body>
</html>
