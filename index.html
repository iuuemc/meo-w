
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>มาง้ออะ 💨</title>

  <style>
    /* ===== ตั้งค่าหน้าเว็บ ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: linear-gradient(140deg, #fff1f6, #ffd6e7);
      font-family: system-ui, sans-serif;
      color: #a63e66;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
    }

    .wrap {
      width: min(95vw, 460px);
      padding: 24px;
    }

    h1 {
      font-size: clamp(29px, 7vw, 40px);
    }

    p {
      font-size: 17px;
    }

    /* ===== พื้นที่ปุ่ม ===== */
    .stage {
      height: 300px;
      position: relative;
      margin: 15px auto;
    }

    button {
      border: 0;
      border-radius: 30px;
      padding: 15px 23px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* ===== ปุ่มหายงอน ===== */
    #yes {
      position: absolute;
      top: 25px;
      left: 7%;
      background: #f74e8d;
      color: white;
      transform-origin: top left;
      transition: transform 0.2s;
      z-index: 2;
    }

    /* ===== ปุ่มโกด ===== */
    #no {
      position: absolute;
      top: 25px;
      right: 7%;
      background: white;
      color: #c84c7a;
      z-index: 3;
      transition: left 0.12s, top 0.12s;
    }

    /* ===== หน้าคืนดี ===== */
    #success {
      display: none;
    }

    #success img {
      width: min(80vw, 320px);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 25px;
      box-shadow: 0 12px 35px #d6598b55;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <!-- ===== หน้าแรก: มาง้อ ===== -->
    <section id="question">

      <div style="font-size: 65px;">🐶</div>

      <h1>มาง้ออะ💨</h1>

      <p>หายโกดกันได้มั้ย</p>

      <div class="stage" id="stage">

        <button id="yes">
          💖 หายโกด
        </button>

        <button id="no">
          😤 โกด
        </button>

      </div>

      <p id="message">เลือกดี ๆ น้าา 🥹</p>

    </section>


    <!-- ===== หน้าที่สอง: คืนดี ===== -->
    <section id="success">

      <h1>เย้! คืนดีกันแลวว </h1>

      <p>ปุ้ดดดดดดด💨</p>

      <img
        src="puppies.jpg"
        alt="ลูกหมาสีดำกอดลูกหมาสีขาว"
      >

      <h2>🐶🐶🐶</h2>

      <p></p>

    </section>

  </main>


  <script>
    // ===== ตัวแปร =====
    let count = 0;
    let last = 0;

    const no = document.querySelector("#no");
    const yes = document.querySelector("#yes");
    const stage = document.querySelector("#stage");
    const msg = document.querySelector("#message");


    // ===== ข้อความเมื่อพยายามกดปุ่มโกด =====
    const lines = [
      "งื้ออ อย่าโกดเลย 🥺",
      "จับไม่ได้หรอก แบร่ 😝",
      "หายโกดเถอะน้าา 💕",
      "ปุ่มนี้ไม่ให้กดหรอก 😤",
      "กดฉันให้ได้สิ 💨"
    ];


    // ===== ฟังก์ชันให้ปุ่มโกดหนี =====
    function flee(e) {

      if (e?.cancelable) {
        e.preventDefault();
      }

      // ป้องกันการทำงานถี่เกินไป
      if (Date.now() - last < 150) {
        return;
      }

      last = Date.now();
      count++;


      // ปุ่มโกดเล็กลงเรื่อย ๆ
      let scale = Math.max(0.2, 1 - count * 0.12);

      no.style.fontSize = (18 * scale) + "px";

      no.style.padding =
        (15 * scale) + "px " +
        (23 * scale) + "px";


      // สุ่มตำแหน่งใหม่ของปุ่มโกด
      const maxX = stage.clientWidth - no.offsetWidth;
      const maxY = stage.clientHeight - no.offsetHeight;

      no.style.left =
        Math.random() * Math.max(0, maxX) + "px";

      no.style.top =
        (100 + Math.random() * Math.max(0, maxY - 100)) + "px";

      no.style.right = "auto";


      // ปุ่มหายงอนใหญ่ขึ้นเรื่อย ๆ
      yes.style.transform =
        `scale(${Math.min(2.25, 1 + count * 0.16)})`;


      // เปลี่ยนข้อความง้อ
      msg.textContent = lines[(count - 1) % lines.length];
    }


    // ===== เมื่อเมาส์เข้าใกล้ปุ่มโกด =====
    no.addEventListener("pointerenter", e => {
      if (e.pointerType === "mouse") {
        flee(e);
      }
    });


    // ===== เมื่อแตะปุ่มโกดบนมือถือ =====
    no.addEventListener("pointerdown", flee);

    no.addEventListener("click", flee);


    // ===== เมื่อกดปุ่มหายงอน =====
    yes.addEventListener("click", () => {

      document.querySelector("#question").style.display = "none";

      document.querySelector("#success").style.display = "block";

    });

  </script>

</body>
</html>
